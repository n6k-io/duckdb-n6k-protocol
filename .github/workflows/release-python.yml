name: Publish python package

# Triggered by pushing a tag like `python/v0.4.1`. Bump + tag with:
#   cd packages/python && uv version --bump patch
#   git commit -am "python 0.4.1" && git tag python/v0.4.1 && git push --follow-tags
# Publishes packages/python (n6k-duckdb) to PyPI via OIDC trusted publishing.

on:
  push:
    tags:
      - "python/v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify tag matches pyproject version
        working-directory: packages/python
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#python/v}"
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$TAG_VERSION pyproject=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $PKG_VERSION"
            exit 1
          fi

      - name: Build package
        run: uv build --package n6k-duckdb --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI OIDC trusted publishing
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
